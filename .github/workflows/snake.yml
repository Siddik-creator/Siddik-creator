
name: Generate Emerald Matrix Snake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Emerald Matrix Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Siddik-creator
          outputs: |
            dist/snake.svg?palette=github-dark&backgroundColor=07130f&color_snake=22c55e
            dist/snake-dark.svg?palette=github-dark&backgroundColor=07130f&color_snake=22c55e

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
